<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contato - ODS 15</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
  </script>
  <script type="text/javascript">
    (function () {
      emailjs.init({
        publicKey: "OCVyl4_xEhlmoRUh4",
      });
    })();
  </script>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="#"><i class="bi bi-globe2 me-2"></i>ODS 15</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Página Inicial</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="data.html">Dados</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="contato.html">Contato</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="header-contato text-center bg-light py-5">
    <div class="container">
      <h1 class="display-5 fw-bold">Entre em Contato</h1>
      <p class="lead">Tem dúvidas, sugestões ou quer saber mais sobre o projeto? Envie uma mensagem pra gente!</p>
    </div>
  </header>

  <section class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow-sm border-success">
          <div class="card-body">
            <h5 class="card-title text-success"><i class="bi bi-envelope-paper-fill me-2"></i>Formulário de Contato</h5>
            <form id="contact-form">
              <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" placeholder="Seu nome completo" required>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" placeholder="seuemail@exemplo.com" required>
              </div>
              <div class="mb-3">
                <label for="mensagem" class="form-label">Mensagem</label>
                <textarea class="form-control" id="mensagem" rows="5" placeholder="Digite sua mensagem aqui..."
                  required></textarea>
              </div>
              <button type="submit" class="btn btn-success"><i class="bi bi-send-fill me-1"></i>Enviar</button>
            </form>
            <div id="status-message" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="text-center text-white py-3" style="background-color: #1b4332;">
    <p class="mb-0">&copy; Faculdade Unianchieta - Todos os direitos reservados.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>

    document.getElementById("contact-form").addEventListener("submit", function (event) {
      event.preventDefault(); 

      const nome = document.getElementById("nome").value;
      const email = document.getElementById("email").value;
      const mensagem = document.getElementById("mensagem").value;

      if (nome === "" || email === "" || mensagem === "") {
        document.getElementById("status-message").innerHTML = '<div class="alert alert-danger">Por favor, preencha todos os campos.</div>';
        return;
      }

      const templateParams = {
        from_name: nome,
        from_email: email,
        message: mensagem
      };

      emailjs.send("service_ivwpxkj", "template_3pjg9e4", templateParams)
        .then(function (response) {
          document.getElementById("status-message").innerHTML = '<div class="alert alert-success">Mensagem enviada com sucesso!</div>';
        }, function (error) {
          document.getElementById("status-message").innerHTML = '<div class="alert alert-danger">Ocorreu um erro ao enviar a mensagem. Tente novamente mais tarde.</div>';
        });
    });
  </script>
</body>

</html>
