          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Página Inicial</a>
            </li>

            <li class="nav-item">

    <header class="header-form text-center bg-light py-5">
      <div class="container">
        <h1 class="display-5 fw-bold">Formulário de Hábitos Sustentáveis</h1>
        <p class="lead">
          Participe da pesquisa e ajude a entender os hábitos que impactam o
          meio ambiente.
        </p>
      </div>
    </header>

    <section class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card shadow-sm border-success">
            <div class="card-body">
              <h4 class="text-success mb-4">
                <i class="bi bi-pencil-square me-2"></i>Responda o formulário
              </h4>

              <form>
                <div class="mb-3">
                  <label for="idade" class="form-label">Idade</label>
                  <input
                    type="number"
                    class="form-control"
                    id="idade"
                    placeholder="Ex: 25"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="transporte" class="form-label"
                    >Modo preferido de locomoção</label
                  >
                  <select class="form-select" id="transporte" required>
                    <option value="">Selecione...</option>
                    <option>Carro</option>
                    <option>Moto</option>
                    <option>Transporte público</option>
                    <option>Bicicleta</option>
                    <option>A pé</option>
                    <option>Uber/Carona</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="km" class="form-label"
                    >Média de quilômetros percorridos por dia</label
                  >
                  <input
                    type="number"
                    class="form-control"
                    id="km"
                    placeholder="Ex: 30"
                  />
                </div>

                <div class="mb-3">
                  <label for="transportePublico" class="form-label"
                    >Quantos dias por semana utiliza transporte público?</label
                  >
                  <input
                    type="number"
                    class="form-control"
                    id="transportePublico"
                    placeholder="Ex: 3"
                  />
                </div>

                <div class="mb-3">
                  <label for="carne" class="form-label"
                    >Refeições com carne vermelha por semana</label
                  >
                  <input
                    type="number"
                    class="form-control"
                    id="carne"
                    placeholder="Ex: 5"
                  />
                </div>

                <div class="text-center mt-4">
                  <button type="submit" class="btn btn-success px-4">
                    <i class="bi bi-send me-2"></i>Enviar Resposta
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- FOOTER -->
    <footer
      class="text-center text-white py-3"
      style="background-color: #1b4332"

        &copy; Faculdade Unianchieta - Todos os direitos reservados.
      </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const loginBtn = document.getElementById("loginBtn");
        const signupBtn = document.getElementById("signupBtn");

        // Cria os tooltips manualmente
        const createTooltip = (btn, content) => {
          const tooltip = document.createElement("div");
          tooltip.className = "custom-tooltip card shadow p-3";
          tooltip.innerHTML = content;
          document.body.appendChild(tooltip);

          const rect = btn.getBoundingClientRect();
          tooltip.style.position = "absolute";
          tooltip.style.top = rect.bottom + window.scrollY + 8 + "px";
          tooltip.style.left = rect.left + "px";
          tooltip.style.zIndex = 9999;

          // Fecha se clicar fora
          const closeTooltip = (e) => {
            if (!tooltip.contains(e.target) && e.target !== btn) {
              tooltip.remove();
              document.removeEventListener("click", closeTooltip);
            }
          };
          document.addEventListener("click", closeTooltip);
        };

        loginBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          document
            .querySelectorAll(".custom-tooltip")
            .forEach((t) => t.remove());
          createTooltip(
            loginBtn,
            `
        <h6 class="text-success mb-2"><i class="bi bi-box-arrow-in-right me-1"></i>Login</h6>
        <form id="loginForm">
          <input type="email" class="form-control mb-2" placeholder="E-mail" required />
          <input type="password" class="form-control mb-3" placeholder="Senha" required />
          <button class="btn btn-success btn-sm w-100" type="submit">Entrar</button>
        </form>
      `
          );
        });

        signupBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          document
            .querySelectorAll(".custom-tooltip")
            .forEach((t) => t.remove());
          createTooltip(
            signupBtn,
            `
        <h6 class="text-success mb-2"><i class="bi bi-person-plus me-1"></i>Cadastre-se</h6>
        <form id="signupForm">
          <input type="text" class="form-control mb-2" placeholder="Nome" required />
          <input type="email" class="form-control mb-2" placeholder="E-mail" required />
          <input type="password" class="form-control mb-3" placeholder="Senha" required />
          <button class="btn btn-success btn-sm w-100" type="submit">Cadastrar</button>
        </form>
      `
          );
        });
      });
            document.addEventListener("DOMContentLoaded", () => {
        const logoutItem = document.getElementById("logoutItem");
        const logoutBtn = document.getElementById("logoutBtn");
        const token = localStorage.getItem("token-api");
        const loginBtn = document.getElementById("loginBtn");
        const signupBtn = document.getElementById("signupBtn");
        const formBtn = document.getElementById("form-button");

        // Exibe o botão "Sair" só se o usuário estiver logado
        if (token) {
          logoutItem.style.display = "block";
          formBtn.style.display = "block";
          loginBtn.style.display = "none";
          signupBtn.style.display = "none";
        } else {
          logoutItem.style.display = "none";
          formBtn.style.display = "none";
        }

        // Evento de logout
        logoutBtn.addEventListener("click", (ev) => {
          ev.preventDefault();
          localStorage.removeItem("token-api");
          alert("Você saiu da conta.");
          window.location.href = "index.html"; // redireciona pra home
        });
      });
    </script>

    <style>
      .custom-tooltip {
        min-width: 220px;
        border-radius: 10px;
        border: 1px solid #19875450;
      }
      .custom-tooltip input {
        font-size: 0.9rem;
      }
      .custom-tooltip::before {
        content: "";
        position: absolute;
        top: -6px;
        left: 20px;
        border-width: 6px;
        border-style: solid;
        border-color: transparent transparent #fff transparent;
      }
    </style>
  </body>
</html>
